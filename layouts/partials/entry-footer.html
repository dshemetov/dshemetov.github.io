{{- /* Post time and tags, shown below a post and below each home page entry. */ -}}
<p class="entry-footer">
  <a href="{{ .Permalink }}"><time datetime='{{ .Date.Format "2006-01-02T15:04:05-07:00" }}'>{{ .Date.Format "3:04pm" }}</time></a>
  {{- range .GetTerms "tags" }}
  <a class="tag tag-{{ .Data.Term | urlize }}" href="{{ .Permalink }}">#{{ .LinkTitle }}</a>
  {{- end }}
</p>
